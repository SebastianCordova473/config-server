#spring configuration
spring.application.name=configserver
server.port=${CONFIG_SERVER_PORT:8888}
spring.cloud.config.server.git.uri=https://github.com/SebastianCordova473/notary-configuration-properties.git
spring.cloud.config.server.git.username=${GIT_USERNAME}
spring.cloud.config.server.git.password=${GIT_PROFILE}
spring.cloud.config.profile=${RAILWAY_ENVIRONMENT_NAME}
spring.cloud.config.label=${RAILWAY_ENVIRONMENT_NAME}
spring.cloud.config.server.git.clone-on-start=true

#management configuration
management.endpoints.web.base-path=/
management.server.ssl.enabled=false
management.endpoint.health.enabled=true
management.health.diskspace.enabled=false
management.endpoints.web.exposure.include=health,info,loggers,encrypt,decrypt
management.endpoints.web.path-mapping.loggers=loggers
management.endpoints.web.path-mapping.health=health
management.endpoints.web.path-mapping.info=info
management.endpoints.web.path-mapping.decrypt=decrypt
management.endpoint.health.probes.add-additional-paths=true
management.server.port=${server.port}


encrypt.key=${JASYPT_ENCRYPTOR_PASSWORD:j0g42025}
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:j0g42025}